[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"
name = "mcp_linux_ssh"
version = "0.0.1"
dependencies = [
    "mcp[cli]",
]

[project.optional-dependencies]
dev = [
    "ipdb",
    "pytest-asyncio",
    "pytest-cov",
    "pytest",
    "ruff",
]

[project.scripts]
mcp-linux-ssh = "mcp_linux_ssh.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "-r", "a",
    "--verbose",
    "--strict-markers",
    "--cov", "src",
    "--cov-branch",
    "--cov-report", "html",
    "--cov-report", "term-missing:skip-covered",
    "--durations-min", "1",
    "--durations", "10",
    "--color", "yes",
    "--showlocals",
    "--pdbcls", "IPython.terminal.debugger:TerminalPdb",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = "tests"
pythonpath = "src"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
